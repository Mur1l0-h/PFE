<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header class="mb-5">
        <img src="Imgs/instagramIcon.png" alt="" class="InstaIcon m-3">

        <section class="container">
            <div class="row">
                <div class="rounded-circle bg-black me-3 col-1 Story"></div>
                <div class="rounded-circle bg-black me-3 col-1 Story"></div>
                <div class="rounded-circle bg-black me-3 col-1 Story"></div>
            </div>
        </section>

    </header>

    <div class="container-fluid">
        <main class="d-flex row ">
            <section class="NavBar col-2">

                <ul>
                    <li> <i class="bi bi-house-door-fill"></i> Home</li>
                    <li> <i class="bi bi-search"></i> Explore</li>
                    <li> <i class="bi bi-messenger"></i> Messages</li>
                    <li> <i class="bi bi-bell-fill"></i> Notifications</li>
                    <li> <i class="bi bi-plus-circle-fill"></i> Create</li>
                </ul>

                <ul class="Profile">
                    <li> <i class="bi bi-person-fill"></i> Profile</li>
                </ul>
            </section>

            <section class="col-8">
                <div class="d-flex justify-content-center">
                    <div class="w-75 Posts">
                        <div>
                            <div id="carouselExample" class="carousel slide">
                                <div class="carousel-inner">
                                    <div class="carousel-item active">
                                        <img src="Imgs/gru.webp" class="d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="Imgs/mamaco.webp" class="d-block w-100" alt="...">
                                    </div>
                                    <div class="carousel-item">
                                        <img src="Imgs/paisagem.jpg" class="d-block w-100" alt="...">
                                    </div>
                                </div>
                                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                                    data-bs-slide="prev">
                                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Previous</span>
                                </button>
                                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                                    data-bs-slide="next">
                                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                    <span class="visually-hidden">Next</span>
                                </button>
                            </div>
                        </div>

                        <div class="Teste">
                            <img src="Imgs/gru.webp" alt="">
                        </div>
                    </div>
                </div>
            </section>
            <section class="col-2">
                teste
            </section>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
