<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Cartão</title>
</head>

<body>
    <main class="d-flex align-items-center" id="MainId">
        <section class="container">
            <h1 class="text-center ">Editor de cartão</h1>
            <form action="#" class="mt-5">
                <div class="row align-items-center justify-content-center">
                    <div class="col-4">
                        <div>
                            <label for="" class="mb-2 fw-bold fs-5">Nome</label><br>
                            <input id="valorNome" type="text" class="col-6 mb-2"><br>
                            <label for="" class="mb-2 fw-bold fs-5">Cargo</label><br>
                            <input id="valorCargo" type="text" class="col-6 mb-2"><br>
                        </div>
                    </div>
                    <div class="col-6" id="Cartao" >
                        <p id="Nome" class="fs-4 mt-4"></p>
                        <p id="Cargo" class=" fs-4"></p>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
