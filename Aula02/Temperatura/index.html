<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de temperatura</title>
</head>

<body>
    <main class="d-flex align-items-center" id="MainId">
        <section class="container">
            <h1 class="text-center ">Conversor de C para F</h1>
            <form action="#" class="mt-5">
                <div class="row align-items-center justify-content-center">
                    <div class="d-flex justify-content-center ">
                        <div>
                            <label for="" class="mb-2 fw-bold fs-5">Digite a temperatura que quer converter</label><br>
                            <input id="valorUsuario" type="number" class="col-12 mb-2">
                        </div>
                    </div>
                    <div id="botaoCalculo" class="btn btn-success col-1 fw-bold">Calcular</div>
                </div>
            </form>
            <div id="RespostaDoCalculo" class="fw-bold text-center mt-4"></div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
